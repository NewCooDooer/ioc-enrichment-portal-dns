# Windows 95 look: the detailed styling lives in frontend/theme.py. No external fonts or assets are loaded.
[theme]
base = "light"
primaryColor = "#000080"
backgroundColor = "#008080"
secondaryBackgroundColor = "#c0c0c0"
textColor = "#000000"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

# Only this computer may open the page. Streamlit's default is every network interface, which would let anyone on the
# same network run lookups through this machine. Change it only on purpose (e.g. a trusted lab network).
[server]
address = "127.0.0.1"
